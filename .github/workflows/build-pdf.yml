name: Build and Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write  # Required to push the PDFs to the gh-pages branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive  # To include style files
          fetch-depth: 0

      # TeX Live is pinned rather than tracking latest. On TeX Live 2026,
      # loading common/tonas-thesis.sty aborts with "Command \c@lemma already
      # defined": thmtools aliases a counter for each \newtheorem that shares
      # the theorem counter, and something in that distribution defines it a
      # second time. Pinning reproduces the environment the thesis was written
      # and checked against, alongside the vendored ut-thesis-local.cls.
      #
      # Note: 2024 is the newest value that actually pins. In this action,
      # "2025" (and "latest", and the empty value) all resolve to the rolling
      # texlive-full:latest image, which is now TeX Live 2026 -- so asking for
      # 2025 silently gives you the very version that fails. 2024 maps to the
      # frozen tag texlive-full:20250301.
      - name: Compile thesis
        uses: xu-cheng/latex-action@v3
        with:
          root_file: thesis.tex
          texlive_version: 2024

      - name: Prepare deployment folder
        run: |
          mkdir public
          cp index.html public/
          cp favicon.ico public/
          mv thesis.pdf public/
          touch public/.nojekyll  # Prevents Jekyll processing on GitHub Pages

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          force_orphan: true  # Keeps the deployment branch clean and small
          cname: thesis.wiederhold.dev
